[services.web]
root = "frontend/"

[services.api]
root = "backend/"
entrypoint = "app.main:app"

[[rewrites]]
source = "/api/(.*)"
destination = { service = "api" }

[[rewrites]]
source = "/docs(.*)"
destination = { service = "api" }

[[rewrites]]
source = "/openapi.json"
destination = { service = "api" }

[[rewrites]]
source = "/redoc(.*)"
destination = { service = "api" }

[[rewrites]]
source = "/(.*)"
destination = { service = "web" }
