[project]
name = "safetrip-ai"
version = "2.0.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.138.0",
  "uvicorn>=0.29.0",
  "sqlalchemy>=2.0.0",
  "pydantic>=2.6.0",
  "scikit-learn>=1.4.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "joblib>=1.3.0",
  "networkx>=3.2.0",
  "pypdf>=4.0.0",
  "reportlab>=4.1.0",
  "PyJWT>=2.8.0",
  "python-multipart>=0.0.9",
  "requests>=2.31.0",
  "psycopg2-binary>=2.9.9",
  "psycopg[binary]>=3.2.0",
]

[tool.vercel]
entrypoint = "index:app"

[tool.vercel.scripts]
build = "npm ci --prefix frontend && npm run build --prefix frontend"
